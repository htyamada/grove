{% load documentview_extras %}
<div class="dv-reader-controls">
{% for suffix, variant in doc.variants.items %}
  {% with active_link=active|dict_get:suffix %}
  {% if active_link %}
  <form method="post" action="{% url 'documentview:active_remove' %}" class="dv-active-form">
    {% csrf_token %}
    <input type="hidden" name="link_name" value="{{ active_link }}">
    <input type="hidden" name="rel_path" value="{{ variant.rel_path }}">
    <input type="hidden" name="return_to" value="{{ request.get_full_path }}">
    <button type="submit">Remove {{ suffix|upper }} from reader</button>
  </form>
  {% else %}
  <form method="post" action="{% url 'documentview:active_add' %}" class="dv-active-form">
    {% csrf_token %}
    <input type="hidden" name="rel_path" value="{{ variant.rel_path }}">
    <input type="hidden" name="return_to" value="{{ request.get_full_path }}">
    <button type="submit">Add {{ suffix|upper }} to reader</button>
  </form>
  {% endif %}
  {% endwith %}
{% endfor %}
</div>
